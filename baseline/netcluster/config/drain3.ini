[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [{"regex_pattern": "\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b", "mask_with": "IP"}, {"regex_pattern": "\\b[0-9a-fA-F:]{2,}:[0-9a-fA-F:]+\\b", "mask_with": "IPV6"}, {"regex_pattern": "\\b\\d+\\b", "mask_with": "NUM"}]
mask_prefix = <:
mask_suffix = :>

[DRAIN]
sim_th = 0.3
depth = 6
max_children = 100
max_clusters = 4096
extra_delimiters = ["_", "|", "="]

[PROFILING]
enabled = False
